name: Dependabot review and release

# Dependabot が出した更新 PR を Claude Code にレビューさせ、問題なければマージ、
# 問題があればクローズし、全部片付いたらバージョンを上げてタグを打ち、npm に publish する。
# モデルは下の REVIEW_MODEL 一箇所で決まり、PR コメントとリリースコミットの記録にも
# そこから流れる。切り替えるときは REVIEW_MODEL だけ書き換えればよい。
#
# Claude Code は anthropics/claude-code-action を通さず、CLI を直接動かしている。
# アクション経由の呼び出しだけが、残高があっても "Credit balance is too low" で
# 拒否されるため（anthropics/claude-code-action#1888、v1.0.248 で再現）。同じ資格情報で
# CLI を直接動かす分には通る。直ったらアクションに戻してよい。そのときは review
# ジョブの「レビューする」に並べた注意点（読み取り専用トークン、OIDC の要求用変数を
# 渡さない、--setting-sources user）をアクションの入力で満たすこと。
#
# 権限の配り方がこのワークフローの要点。レビューするモデルが読むのは PR 本文に
# 埋め込まれた上流のリリースノートや npm レジストリの応答、つまり攻撃者が書ける文章で
# ある。それを読んだエージェント自身がマージまでできると、このワークフローが防ごうと
# している攻撃がそのまま通る。だから review ジョブのトークンは読み取り専用にし、
# マージ・クローズ・タグ push は評決 JSON を受け取った apply ジョブの側で行う。
# npm への publish はさらに別ジョブに分け、書き込み権限を持たせずに OIDC だけを渡す。
#
# publish は npm の trusted publishing（OIDC）を使う。npm 側にトークンを置かないので、
# 漏れて困る長期の資格情報がそもそも存在しない。npm 側の登録内容は README.md の
# 「npm への publish」を参照。**npm には「ワークフローのファイル名」を登録するため、
# このファイルをリネームすると publish が 403 で落ちる。**
#
# Claude API への認証も ID フェデレーション（OIDC）で、API キーは置かない。そのため
# review ジョブも id-token: write を持つ。npm はワークフローのファイル名しか見ないと
# review ジョブの OIDC トークンでも publish できてしまうので、publish ジョブだけを
# environment `npm` に入れ、npm 側にもその environment 名を登録する。**npm 側の
# environment 名を外すと、上流の文章を読む review ジョブから publish できる状態に戻る。**

on:
  schedule:
    # 火曜 00:00 JST。GitHub の cron は UTC 固定なので月曜 15:00 UTC と書く。
    # Dependabot は月曜 09:00 JST に PR を作る（.github/dependabot.yml）ので、その 15 時間後。
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "レビューと検証だけ行い、マージ・クローズ・リリースはしない"
        type: boolean
        default: true
      publish_tag:
        description: "既存のタグを npm に publish するだけ（レビューもマージもリリースもしない）"
        type: string
        default: ""

# 既定は何も許可しない。必要な権限はジョブごとに与える。
permissions: {}

concurrency:
  group: dependabot-review-release
  cancel-in-progress: false

env:
  # Claude Code に渡すモデル ID（Opus 5.5）。Claude API の従量課金で、使用量は
  # フェデレーションの先にあるサービスアカウントのワークスペースに付く。
  # セキュリティ特化のモデルではないぶん、レビュー手順は
  # .github/scripts/review-prompt.md 側で明示的に指示している。
  REVIEW_MODEL: claude-opus-5-5
  # Claude Code CLI のバージョン。Dependabot は追わないので手で上げる。
  CLAUDE_CODE_VERSION: 2.1.296

jobs:
  collect:
    name: 対象の PR を集める
    # publish_tag を指定した回は PR を見ない。collect が skipped になると、
    # それに連なる review と apply も動かず、publish だけが残る。
    if: inputs.publish_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 開いている Dependabot PR を列挙する
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --author "app/dependabot" \
            --state open --limit 50 \
            --json number,title,url,headRefName > prs.json

          count=$(jq length prs.json)
          {
            echo "count=$count"
            echo "prs=$(jq -c '[.[].number]' prs.json)"
          } >> "$GITHUB_OUTPUT"

          # ここを `[ "$count" -eq 0 ] && echo ...` と書かないこと。run ブロックの
          # 最後のコマンドになるため、PR が 1 件以上あると偽 -> 終了ステータス 1 で
          # ステップが失敗する。
          {
            echo "## 対象の PR: ${count} 件"
            echo
            jq -r '.[] | "- [#\(.number)](\(.url)) \(.title)"' prs.json
            if [ "$count" -eq 0 ]; then
              echo "更新 PR はありません。バージョンも上げません。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: prs
          path: prs.json

  review:
    # ジョブ名には env コンテキストを書けないので、モデル名はステップのログに出す
    name: "#${{ matrix.pr }} をレビュー"
    needs: collect
    if: needs.collect.outputs.count != '0'
    runs-on: ubuntu-latest
    # 読み取り専用。モデルがマージ・コメント・push を試みても失敗する。
    permissions:
      contents: read
      pull-requests: read
      # Claude API の ID フェデレーション用。GitHub への権限は増えない。npm は
      # environment `npm` のトークンしか受け付けないので、このジョブからは
      # publish できない。
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pr: ${{ fromJSON(needs.collect.outputs.prs) }}
    steps:
      - uses: actions/checkout@v5
        with:
          # チェックアウトが git config に残す資格情報も渡さない
          persist-credentials: false

      - name: プロンプトを用意する
        env:
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          echo "model: ${REVIEW_MODEL} / Claude Code ${CLAUDE_CODE_VERSION}"

          # チェックアウトの外に置く。作業ツリーにはリポジトリの中身だけを置いておく。
          mkdir -p "$RUNNER_TEMP/review"
          python3 - > "$RUNNER_TEMP/review/prompt.txt" <<'PY'
          import os, pathlib
          t = pathlib.Path(".github/scripts/review-prompt.md").read_text(encoding="utf-8")
          print(t.replace("{{PR_NUMBER}}", os.environ["PR_NUMBER"])
                 .replace("{{REPO}}", os.environ["GITHUB_REPOSITORY"]))
          PY

      - name: Claude Code を入れる
        run: |
          set -euo pipefail
          # アクションと同じ入れ方。バージョンは固定し、実行中の自動更新も止める
          # （次のステップの DISABLE_AUTOUPDATER）。
          for attempt in 1 2 3; do
            timeout --foreground --kill-after=10 120 \
              bash -c 'set -o pipefail; curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CODE_VERSION"' \
              && break
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Claude Code ${CLAUDE_CODE_VERSION} を入れられなかった。"
              exit 1
            fi
            sleep 5
          done
          installed=$("$HOME/.local/bin/claude" --version | awk '{print $1}')
          if [ "$installed" != "$CLAUDE_CODE_VERSION" ]; then
            echo "::error::入ったのは Claude Code ${installed} で、指定の ${CLAUDE_CODE_VERSION} ではない。"
            exit 1
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 権限の要点は 5 つ。
      #
      # GitHub へは、このジョブの読み取り専用トークン（GH_TOKEN）だけを渡す。上の
      # permissions がそのまま効き、モデルがマージ・コメント・push を試みても失敗する。
      #
      # Claude API へは ID フェデレーションで入る。GitHub の OIDC トークンを、
      # フェデレーションルールの寿命（token_lifetime_seconds）だけ有効なアクセス
      # トークンに引き換えるので、漏れて困る長期の API キーが無い。ID は資格情報では
      # ないが、組織の構成をログや公開リポジトリに出さないよう secrets に置く。
      # ANTHROPIC_API_KEY は渡さないこと。静的なキーがあるとそちらが優先され、
      # フェデレーションは黙って使われなくなる。
      #
      # OIDC トークンの要求用変数（ACTIONS_ID_TOKEN_REQUEST_*）は Claude Code に渡さない。
      # 渡すと、上流の文章に誘導されたモデルが、このジョブの名前で OIDC トークンを
      # 取れてしまう。トークンを取るのはこのシェルだけで、Claude Code はファイルを読む。
      #
      # --allowedTools で、モデルが動かせるコマンドを読み取り系の gh と npm view に絞る。
      # advisory / 上流のリリースとタグ間差分 / npm レジストリ上の実物を引くにはこれで
      # 足りる。-p では確認を出せないので、許可していないコマンドは拒否される。
      #
      # --setting-sources user で、チェックアウトした .claude/ を読ませない。そこにある
      # 手元用の dependabot-merge スキルはマージとリリースまで進める手順で、このレビューの
      # 依頼にほぼそのまま当てはまってしまう。レビュー担当に見せるのはプロンプトだけにする。
      #
      # Claude Code の出力はファイルに書き、ログには結果の要約だけを出す。モデルが読んだ
      # 上流の文章はログに流さない。
      - name: レビューする
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          DISABLE_AUTOUPDATER: "1"
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/review"
          wif="$RUNNER_TEMP/claude-wif"
          mkdir -p "$wif/config/configs"

          # 空の変数も「指定あり」として扱われるので、secret が空なら消しておく。
          # ルールのワークスペースが 1 つなら、送らなくてもサーバーが選ぶ。
          [ -n "${ANTHROPIC_WORKSPACE_ID:-}" ] || unset ANTHROPIC_WORKSPACE_ID

          export ANTHROPIC_IDENTITY_TOKEN_FILE="$wif/identity-token"
          fetch_identity_token() {
            local token
            token=$(curl -fsS --retry 3 \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -er .value) || return 1
            echo "::add-mask::${token}"
            # 読みかけのファイルを Claude Code に掴ませないよう、書いてから差し替える
            printf '%s' "$token" > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp"
            mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch_identity_token

          # フェデレーションをプロファイル経由にすると、交換したアクセストークンが
          # ディスクにキャッシュされ、Claude Code の子プロセスとも共有される。GitHub の
          # OIDC トークンは 1 回しか交換できない（jti）ので、プロセスごとに交換し直すと
          # 2 回目が jti_reused で拒否される。中身はこれだけでよく、残りの項目は
          # 上の ANTHROPIC_* から補われる。
          export ANTHROPIC_CONFIG_DIR="$wif/config" ANTHROPIC_PROFILE=default
          echo '{"version":"1.0","authentication":{"type":"oidc_federation"}}' \
            > "$ANTHROPIC_CONFIG_DIR/configs/default.json"

          # GitHub の OIDC トークンは 5 分で切れ、交換で得るアクセストークンの寿命も
          # その残り時間の 2 倍までに縛られる。Claude Code は更新のたびにファイルを
          # 読み直すので、長いレビューの間もファイルを新しく保つ。アクションは 4 分
          # おきだが、それだと残り 1 分のトークンを交換して寿命 2 分のアクセストークンに
          # なることがあるので、1 分おきにする。
          ( while sleep 60 </dev/null >/dev/null 2>&1; do
              fetch_identity_token || echo "::warning::GitHub の OIDC トークンを更新できなかった。"
            done ) &
          refresher=$!
          # キャッシュされたアクセストークンも $wif の下にあるので、まとめて消す
          trap 'kill "$refresher" 2>/dev/null || true; rm -rf "$wif"' EXIT

          # --allowedTools は値を複数取るので最後に置く。後ろに引数があると飲み込まれる。
          status=0
          env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            claude -p \
              --model "$REVIEW_MODEL" \
              --json-schema "$(jq -c . .github/scripts/verdict-schema.json)" \
              --setting-sources user \
              --no-session-persistence \
              --output-format stream-json --verbose \
              --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(gh release view:*),Bash(npm view:*),WebFetch" \
              < "$work/prompt.txt" > "$work/output.jsonl" || status=$?

          jq -c 'select(.type == "result")
                 | {subtype, is_error, duration_ms, num_turns, total_cost_usd}' \
            "$work/output.jsonl" || true
          exit "$status"

      - name: 評決を取り出す
        # レビューが落ちた回も ERROR の評決を書いて成果物に残す
        if: ${{ !cancelled() }}
        env:
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          mkdir -p verdicts

          # 評決はモデルが書いた文字列で、上流の文章をなぞっていることがある。ランナーは
          # 標準出力を workflow command として読むので、止めずに流すと、上流に含まれる
          # `##[add-matcher]...` のような行をランナーが実行しようとして失敗し、
          # 「調べただけ」でジョブが落ちる。読むものは資料であって指示ではない、という
          # 話がモデルだけでなくランナーにも要る。
          #
          # トークンは実行のたびに変える。固定値だと、上流のファイルに ::トークン:: を
          # 仕込んでおいて解釈を再開させられる。
          STOP=$(python3 -c 'import uuid; print(uuid.uuid4())')
          echo "::stop-commands::${STOP}"

          # 評決が取れなかったときは ERROR にする。ERROR は「調べていない」であって
          # 「問題なし」ではないので、apply ジョブはその PR に触れない。評決として使うのは
          # Claude Code が JSON Schema に沿って返した構造化出力だけで、本文は読まない。
          python3 - "$PR_NUMBER" "verdicts/${PR_NUMBER}.json" "$RUNNER_TEMP/review/output.jsonl" <<'PY'
          import json, sys

          pr, dst, src = int(sys.argv[1]), sys.argv[2], sys.argv[3]

          # 出力は 1 行 1 メッセージの JSON（stream-json）。最後の result が実行の結果。
          messages = []
          try:
              with open(src, encoding="utf-8") as f:
                  for line in f:
                      try:
                          m = json.loads(line)
                      except ValueError:
                          continue
                      if isinstance(m, dict):
                          messages.append(m)
          except OSError:
              pass
          result = next((m for m in reversed(messages) if m.get("type") == "result"), {})

          # 失敗の理由は API エラーの種類・HTTP ステータス・CLI のエラー文だけを拾う。
          # 認証や課金で落ちた回に、Console を見る前から原因の見当がつく。
          def failure_detail():
              kinds = [str(m["error"]) for m in messages
                       if m.get("type") == "assistant" and m.get("error")]
              status = result.get("api_error_status")
              parts = kinds[-1:] + ([f"HTTP {status}"] if status else [])
              # API エラーのときの result は CLI が作るエラー文で、モデルの文章ではない
              if parts and result.get("is_error") and result.get("result"):
                  parts.append(str(result["result"]))
              parts += [str(e) for e in result.get("errors") or []]
              return " ".join(" / ".join(parts).split())[:300]

          data = None
          if result and not result.get("is_error"):
              data = result.get("structured_output")
          if not isinstance(data, dict) or data.get("verdict") not in ("MERGE", "HOLD"):
              detail = failure_detail()
              data = {
                  "verdict": "ERROR",
                  "reason": f"レビューが完了しなかった: {detail}" if detail
                            else "評決を JSON として取り出せなかった",
                  "updates": "",
                  "checked": "",
                  "notes": "",
                  "unverified": ["レビューが完了せず、脆弱性・上流差分ともに未確認"],
              }

          # 改行やタブが残っていると、PR コメントでも Markdown の表でも崩れる。
          # 中身の良し悪しはここでは判断せず、形だけ整える。
          def flatten(v):
              return " ".join(str(v).split()).strip(" 、,")

          for key in ("reason", "updates", "checked", "notes"):
              data[key] = flatten(data.get(key, ""))
          data["unverified"] = [flatten(u) for u in (data.get("unverified") or []) if flatten(u)]

          data["pr"] = pr  # モデルの申告ではなく、ジョブが知っている番号を使う
          with open(dst, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

          # ここから下は自分の出力なので、workflow command の解釈を戻す。
          # 下の ::error:: を効かせるために必要。
          echo "::${STOP}::"

          {
            echo "## #${PR_NUMBER}"
            echo
            echo '```json'
            cat "verdicts/${PR_NUMBER}.json"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 評決が取れなかったことは緑で流さない。apply ジョブは always() で動くので、
          # ここで落としても他の PR の処理は止まらない。
          if [ "$(jq -r .verdict "verdicts/${PR_NUMBER}.json")" = "ERROR" ]; then
            echo "::error::#${PR_NUMBER} の評決を取得できなかった。この PR には触らない。"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdict-${{ matrix.pr }}
          path: verdicts/

  apply:
    name: マージ・クローズしてタグを打つ
    needs: [collect, review]
    # review が 1 件失敗しても残りは片付ける。失敗した PR は評決が無いので触られない。
    if: always() && needs.collect.result == 'success' && needs.collect.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # next-version.mjs がタグの重複を見るので、履歴とタグを全部持ってくる
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm を入れる
        run: |
          set -euo pipefail
          # package.json の packageManager をそのまま使う。ここにバージョンを
          # 二重に書くと、手元と CI で別の pnpm が動く。
          spec=$(node -p "require('./package.json').packageManager.split('+')[0]")
          npm install -g "$spec"
          pnpm --version

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: verdict-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: prs

      - name: 前提を確認する
        run: |
          set -euo pipefail
          # 作業ツリーが汚れている / main にいない、のどちらかなら片付けようとせず止まる。
          # マージとタグ push は取り消しが面倒なので、前提が崩れたまま進める価値はない。
          #
          # --untracked-files=no を付けているのは、直前の download-artifact が prs.json と
          # artifacts/ を untracked で置くため。見たいのは追跡済みファイルが書き換わって
          # いないかどうかで、成果物の有無ではない。
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::作業ツリーが汚れている。マージとタグ push は行わない。"
            git status --short
            exit 1
          fi
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$branch" != main ]; then
            echo "::error::main にいない (${branch})。マージとタグ push は行わない。"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # マージ前の main。何が実際に変わったかを後で見るために覚えておく。
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 評決に従って PR を片付ける
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash .github/scripts/settle-prs.sh

      - name: バージョンを上げてタグを打つ
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          merged=$(jq -s '[.[] | select(.outcome == "merged")] | length' results.jsonl)
          if [ "$merged" -eq 0 ]; then
            echo "マージできた PR が無いので、上げるものが無い。バージョンは据え置く。" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git pull --ff-only origin main

          # 公開されるのは package.json / catalog.mjs / pnpmfile.mjs だけ（files 参照）。
          # そこが変わっていなければ publish しても中身は同じなので、バージョンを
          # 上げない。GitHub Actions の更新だけがマージされた場合がこれにあたる。
          if git diff --quiet "$BASE_SHA" HEAD -- package.json catalog.mjs pnpmfile.mjs; then
            echo "公開物に変化が無い（GitHub Actions の更新のみ）。バージョンは据え置く。" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # マージ後の main で、カタログ全体が今も一緒に解決できることを確認する。
          # このリポジトリの生成物はカタログ（バージョンの組）そのものなので、これが
          # 検証の本体。git は pnpm-lock.yaml を自動マージできてしまうことがあり、
          # 競合が出なかったことは lockfile が正しいことを意味しない。
          lockfile_flag=()
          if ! pnpm install --frozen-lockfile; then
            echo "::warning::--frozen-lockfile が失敗した。lockfile を package.json に追従させる。"
            # バージョン選択のやり直しではなく、マージ済みの package.json に lockfile を
            # 合わせるだけの操作。
            pnpm install --lockfile-only

            # 解決をやり直した副作用で pnpm が minimumReleaseAgeExclude を書き足したなら、
            # 公開から 24 時間経っていないバージョンを取り込もうとしている。これは
            # 供給網対策として意図的に置いている待ち時間なので、自動で外さない。
            if [ -n "$(git status --porcelain -- pnpm-workspace.yaml)" ]; then
              git checkout -- pnpm-workspace.yaml
              echo "::error::公開直後（24 時間以内）のバージョンが必要になった。minimumReleaseAge を自動で緩めることはしない。マージは済んでいるので、時間を置いて再実行すれば通る。"
              exit 1
            fi

            pnpm install --frozen-lockfile
            lockfile_flag=(--lockfile-regenerated)
          fi
          pnpm test

          # パッチ +1、X.Y.Z 形式の検査、タグの重複チェック、npm に publish 済みで
          # ないことのチェックはこのスクリプトが行う。手で計算しないこと。
          node .claude/skills/dependabot-merge/scripts/next-version.mjs --apply | tee version.txt
          version=$(sed -n 's/^next=//p' version.txt)
          tag=$(sed -n 's/^tag=//p' version.txt)

          python3 .github/scripts/build-release-notes.py \
            --results results.jsonl --version "$version" --model "$REVIEW_MODEL" \
            "${lockfile_flag[@]}" --out release-notes.txt

          # pnpm-lock.yaml は作り直していなければ何も起きない
          git add package.json pnpm-lock.yaml
          git commit -F release-notes.txt
          git tag "$tag"
          git push origin main
          git push origin "$tag"

          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## リリース: ${tag}"
            echo
            echo "タグを push した。この実行の publish ジョブが npm に上げる。"
            echo
            echo '```'
            cat release-notes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-record
          path: |
            results.jsonl
            release-notes.txt
          if-no-files-found: warn

  publish:
    name: npm に publish する
    needs: apply
    # 入口は 2 つ。apply がタグを打った回と、publish_tag を指定して手で起動した回。
    # dry-run・マージ 0 件・公開物に変化なしのいずれでも apply の tag は空になる。
    #
    # 後者が要るのは、Dependabot PR が 1 件も無くても出さないといけないものがある
    # ため。publish 側の設定ミスを直したときが実際にそうだった（tag 1.0.1 は打てたが
    # provenance の検証で弾かれ、直したものを運ぶ PR がどこにも無かった）。
    if: always() && (inputs.publish_tag != '' || needs.apply.outputs.tag != '')
    runs-on: ubuntu-latest
    # npm の trusted publisher にはこの environment 名を登録してある。review ジョブも
    # id-token: write を持つので、npm が受け付けるトークンをこのジョブのものだけに絞る
    # 境界はここ。名前を変えるなら npm 側も同時に変えないと 403 で落ちる。
    environment: npm
    permissions:
      # trusted publishing の OIDC トークンを発行するために要る。
      # 書き込み権限はここには無い。publish 以外のことはできない。
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.publish_tag || needs.apply.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # main の先頭ではなくタグを見る。apply の後に main が動いていても、
          # publish するのは検証してタグを打ったその中身。
          ref: ${{ inputs.publish_tag || needs.apply.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # trusted publishing は Node 22.14 以上と npm 11.5.1 以上が要る
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 前提を確認する
        run: |
          set -euo pipefail

          # npm が古いと OIDC を見に行かず、トークンが無いまま 401 になる。
          # 何が足りないのかログから分かりにくいので、先に上げてしまう。
          have=$(npm --version)
          if ! printf '%s\n%s\n' "11.5.1" "$have" | sort -V -C; then
            echo "npm ${have} は trusted publishing に足りないので上げる"
            npm install -g npm@latest
          fi
          echo "npm: $(npm --version) / node: $(node --version)"

          # タグと package.json の version が食い違ったまま publish すると、
          # タグの指す中身と npm 上のバージョンがずれて後から追えなくなる。
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$TAG" ]; then
            echo "::error::タグ ${TAG} と package.json の version ${version} が一致しない。"
            exit 1
          fi

      - name: テストする
        # 依存は要らない（node:test だけ）。publish 直前にもう一度、公開物の
        # 整合性だけ見る。
        run: node --test test/*.test.mjs

      - name: publish する
        # トークンは渡さない。npm CLI が OIDC を検出して短命の資格情報を取る。
        # 公開リポジトリなので provenance も自動で付く。
        run: npm publish --access public

      - name: 結果を書く
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = "success" ]; then
            {
              echo "## publish 完了: ${TAG}"
              echo
              echo '```'
              echo "pnpm add --config $(node -p "require('./package.json').name")"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## publish 失敗: ${TAG}"
              echo
              echo "タグ \`${TAG}\` は push 済みで、main のバージョンも上がっている。"
              echo "npm に上がっていないのはこの 1 バージョンだけなので、巻き戻さないこと。"
              echo
              echo "追いつき方は 2 つ。"
              echo
              echo "1. この実行の **Re-run failed jobs**。マージ済みの PR は再処理されず、publish だけやり直す。"
              echo "2. 手元から publish する。trusted publishing は CI からしか効かないので、"
              echo "   \`npm login\` してから \`git checkout ${TAG} && npm publish --access public\`。"
              echo
              echo "403 で落ちている場合は、npm 側の trusted publisher 設定"
              echo "（リポジトリ名・ワークフローのファイル名・environment 名）がこのワークフローと一致しているかを見る。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
