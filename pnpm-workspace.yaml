# このリポジトリ自身の設定です。公開物には含まれません（package.json の files を参照）。
#
# ここで `pnpm install` する目的は、カタログに載せた全ライブラリの組み合わせが
# 実際に解決できることを検証することだけです。ビルドも実行もしないため、
# 依存のビルドスクリプトは動かしません。pnpm 11 は未レビューのビルドスクリプトが
# あると install を失敗させる（strictDepBuilds）ので、実行しないことを明示します。
allowBuilds:
  esbuild: false
  msw: false

# pnpm 11 の minimumReleaseAge は既定で 1440 分（24 時間）です。
# 公開直後のバージョンを取り込まないための供給網対策で、カタログの用途とも合うため
# 既定のまま使います。
#
# 下の除外は、カタログに入れた時点で公開から 24 時間経っていなかったものを
# pnpm が自動で追加したものです。時間が経てば不要になるので、
# Dependabot が該当ライブラリを更新したタイミングで削除して構いません。
minimumReleaseAgeExclude:
  - '@types/node@26.1.2'
